# Development tooling for the banners: strict type checking and linting.
# run.py itself runs through uv's inline script metadata, so this project
# only exists to give editors (and `uv run basedpyright`) an environment
# with the same dependencies.

[project]
name = "fish-banners"
version = "0"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow"]

[dependency-groups]
dev = ["basedpyright", "ruff"]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
exclude = [".venv", "**/__pycache__"]
# numpy's own stubs leave parts of some overloads unknown (np.pad, np.clip,
# np.where…), which this rule reports at every call. Everything else in
# strict mode stays on.
reportUnknownMemberType = false

[tool.ruff]
target-version = "py311"
# The text fallback runs on macOS's system Python, which is 3.9.
per-file-target-version = { "_text.py" = "py39" }

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # import sorting
  "UP", # modern syntax for the target Python
  "B", # likely bugs
  "SIM", # simplifications
  "RUF", # ruff's own rules
]
ignore = [
  "E501", # line length is the formatter's job
  "RUF001",
  "RUF002",
  "RUF003", # katakana, ×, – and friends are intended
]
